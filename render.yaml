services:
  - type: web
    name: nexus-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile --prod
    startCommand: pnpm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://tocoboy.github.io
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_SSL
        value: "false"
      - key: CONTACT_RETENTION_DAYS
        value: "180"

databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus
