services:
  - type: web
    name: nexus-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-db
          property: connectionString
      - key: FRONTEND_URL
        value: https://tocoboy.github.io/teste/

databases:
  - name: nexus-db
    plan: free
    databaseName: nexus
    user: nexus
